# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-chatbox-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ktran597/ai_chatbox_map_backend:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /app/data
            echo '{"sessions": {}}' > /app/data/session_memory.json
            exec uvicorn main:app --host 0.0.0.0 --port 8000
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: gemini-api-key
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: google-maps-api-key
        - name: MAPBOX_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: mapbox-access-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data-volume
        emptyDir: {}
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-chatbox-map
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP