# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-chatbox-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
          - containerPort: 80
          volumeMounts:
          - name: test-page-volume
            mountPath: /usr/share/nginx/html/index.html
            subPath: test-page.html
          env:
          - name: REACT_APP_GOOGLE_MAPS_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: google-maps-api-key
          - name: REACT_APP_BACKEND_URL
            value: "http://backend-service:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
      - name: test-page-volume
        configMap:
          name: test-page
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-chatbox-map
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP