# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-chatbox-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ktran597/ai_chatbox_map_frontend:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          env:
          - name: REACT_APP_GOOGLE_MAPS_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: google-maps-api-key
          - name: REACT_APP_BACKEND_URL
            value: "/api"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-chatbox-map
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP